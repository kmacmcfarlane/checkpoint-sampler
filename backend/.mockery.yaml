# mockery v3 configuration.
# Regenerate with: make mocks  (runs `go run github.com/vektra/mockery/v3@v3.7.1`)
# Generated mocks live in a dedicated, predictable package per layer
# (DEVELOPMENT_PRACTICES 3.9). Scope: api-layer interfaces only (W-028).
# The service layer is covered separately by W-029.
all: false
template: testify
dir: "internal/api/apimocks"
filename: "mock_{{.InterfaceName}}.go"
pkgname: "apimocks"
structname: "Mock{{.InterfaceName}}"
force-file-write: true
packages:
  github.com/kmacmcfarlane/checkpoint-sampler/backend/internal/api:
    interfaces:
      ComfyUIHealthChecker:
      ComfyUIModelLister:
      WorkflowLoader:
      PingableConn:
