schema_version: 2
project: checkpoint-sampler
defaults:
  priority_order: "higher_is_more_important"
  status_field: "status"
  blocked_field: "blocked"
  blocked_reason_field: "blocked_reason"
  review_feedback_field: "review_feedback"
  requires_field: "requires"

stories:
  # ─── Enhancements (2026-02-26) ──────────────────────────────────────────────

  # ─── Code quality alignment stories ──────────────────────────────────────────

  - id: B-059
    title: "Training run discovery returns empty — both viewer and Generate Samples selectors show nothing"
    priority: 90
    complexity: medium
    status: closed
    requires: []
    acceptance:
      - "GET /api/training-runs returns training runs discovered from study-scoped sample directories"
      - "GET /api/training-runs?source=checkpoints returns training runs discovered from checkpoint directories"
      - "Sample Set selector in the left drawer populates on initial page load"
      - "Training run selector in Generate Samples dialog populates with checkpoint-based training runs"
      - "Existing E2E tests continue to pass"
    testing:
      - "command: make test-backend"
      - "command: make test-e2e"
    notes: |
      Closed — not a code bug. Root cause was Docker bind mounts created before CIFS mount at /mnt/lucy was available.
      Containers needed recreation (make down && make up-dev) after CIFS was restored.
      No code changes required.
  - id: B-064
    title: "openFiltersDrawer E2E helper strict mode violation — sidebar drawer body remains in DOM after B-060"
    priority: 65
    complexity: low
    status: closed
    requires: []
    acceptance:
      - "All 7 failing tests in combo-solo-click.spec.ts, dimension-filtering.spec.ts, and filters-slideout-layout.spec.ts
        pass with zero strict mode violations"
      - "openFiltersDrawer helper disambiguates between the sidebar drawer body and the filters drawer body"
    testing:
      - "command: make test-e2e SPEC=\"combo-solo-click.spec.ts dimension-filtering.spec.ts filters-slideout-layout.spec.ts\""
    notes: |-
      Fix was proactively applied during B-063 (commit 5b2cf2e). The openFiltersDrawer helper already uses the scoped locator '.n-drawer--right-placement .n-drawer-body-content-wrapper'. All 15 tests pass. No code changes required.
  - id: B-065
    title: "E2E: openFiltersDrawer helper fails with strict mode violation after B-060 dual-drawer change"
    priority: 65
    complexity: low
    status: closed
    requires: []
    acceptance:
      - "The openFiltersDrawer helper selects the correct drawer content wrapper without strict-mode violation"
      - "All 7 failing tests in combo-solo-click.spec.ts, dimension-filtering.spec.ts, and filters-slideout-layout.spec.ts
        pass"
      - "The fix uses a more specific selector such as the filters drawer's NDrawerContent or data-testid attribute"
    testing:
      - "command: make test-e2e SPEC=combo-solo-click.spec.ts"
      - "command: make test-e2e SPEC=dimension-filtering.spec.ts"
      - "command: make test-e2e SPEC=filters-slideout-layout.spec.ts"
    notes: |-
      Duplicate of B-064. The openFiltersDrawer helper was already fixed during B-063 (commit 5b2cf2e) to use '.n-drawer--right-placement .n-drawer-body-content-wrapper'. All 15 affected tests pass.
  - id: S-106
    title: "Integrate ConfirmDeleteDialog into StudyEditor delete flow"
    priority: 45
    status: closed
    complexity: low
    requires:
      - S-094
    acceptance:
      - "FE: StudyEditor uses ConfirmDeleteDialog instead of window.confirm()"
      - "FE: Dialog includes 'Also delete sample data' checkbox"
      - "FE: Unit tests for ConfirmDeleteDialog integration in StudyEditor"
    testing:
      - "Delete a study and verify styled dialog appears instead of browser-native confirm"
    notes: |-
      Already implemented in S-095. StudyEditor already uses ConfirmDeleteDialog with 'Also delete sample data' checkbox. All acceptance criteria satisfied with existing code. No window.confirm() usage remains.
  - id: S-107
    title: "Integrate ConfirmDeleteDialog into preset delete flow"
    priority: 30
    status: closed
    complexity: low
    requires:
      - S-094
    acceptance:
      - "FE: PresetSelector uses ConfirmDeleteDialog instead of window.confirm()"
      - "FE: After deletion, preset selector resets appropriately"
      - "FE: Unit tests for ConfirmDeleteDialog integration in PresetSelector"
    testing:
      - "Delete a preset and verify styled dialog appears"
    notes: |-
      Already implemented as part of S-096 (Delete dimension mapping preset UAT rework). PresetSelector.vue already uses ConfirmDeleteDialog with full unit test coverage.
  - id: W-009
    title: "Populate safetensors test fixtures with minimal valid headers"
    priority: 15
    status: closed
    complexity: low
    requires: []
    acceptance:
      - "E2E: 0-byte .safetensors files in test-fixtures/ replaced with minimal valid headers"
      - "E2E: Minimal header is 8-byte length prefix + empty JSON object"
      - "E2E: No more 'reading header length: EOF' errors in checkpoint metadata scans"
    testing:
      - "Run E2E suite and verify no safetensors header parse errors in logs"
    notes: |-
      Duplicate of B-040 which already replaced 0-byte safetensors fixtures with valid 10-byte minimal headers (8-byte LE length prefix + empty JSON object). All 4 fixture files already contain valid headers. No code changes needed.
  - id: B-083
    title: "E2E: sample-count-preview.spec.ts 2 tests timing out after B-078 per-study validation scoping"
    type: bug
    status: closed
    priority: 70
    complexity: medium
    requires: []
    acceptance:
      - "sample-count-preview.spec.ts test 'Generate Samples dialog shows validation preview with sample counts' passes reliably"
      - "sample-count-preview.spec.ts test 'Generate Samples dialog shows per-checkpoint validation status rows' passes reliably"
      - "Tests use pre-seeded fixture study or create matching sample directories for dynamic studies"
    testing:
      - "command: make test-e2e SPEC=sample-count-preview.spec.ts"
    notes: |-
      Duplicate of B-082. The fix (using pre-seeded fixture study instead of dynamically-created studies) was already applied to sample-count-preview.spec.ts as part of B-082. All 7 tests in the spec pass reliably.
  - id: W-021
    title: "Gitignore Playwright HTML report directory"
    priority: 25
    status: closed
    complexity: low
    requires: []
    acceptance:
      - "OPS: frontend/playwright-report/ is listed in .gitignore"
      - "OPS: No generated report artifacts are accidentally committed"
    notes: |-
      frontend/playwright-report/ is already listed in .gitignore (line 23). No code changes needed.
    testing:
      - "Verify playwright-report/ is gitignored after generating a report"
  - id: B-092
    title: "E2E: Missing studies table and study_id column in test DB schema causes 40+ test failures"
    priority: 80
    status: closed
    complexity: medium
    requires: []
    acceptance:
      - "All E2E tests that query studies or sample_jobs.study_id pass without SQL schema errors"
      - "Test database initialization includes all current migrations"
      - "make test-e2e passes with zero schema-related failures"
    testing:
      - "command: make test-e2e"
    notes: |-
      Already fixed by B-091 commit ca4f5a3 which added 'down -v' pre-clean to make test-e2e target, ensuring stale volumes with old DB schema are always wiped before test runs.
  - id: B-093
    title: "E2E: Preset auto-load via localStorage fails — Delete button not visible after auto-load"
    priority: 70
    status: closed
    complexity: low
    requires: []
    acceptance:
      - "Preset auto-load via localStorage works reliably in E2E tests"
      - "Delete button is visible after preset auto-loads from localStorage seed"
    testing:
      - "command: make test-e2e SPEC=preset-dirty-on-autoload.spec.ts"
    notes: |-
      Already fixed by B-091. The preset auto-load E2E tests pass consistently (4 consecutive runs, all 5 tests passing each time). The timing race that caused the flakiness was eliminated when B-091 replaced the window.prompt listener with the NModal save dialog pattern.
  - id: B-094
    title: "E2E: Lightbox Shift+Arrow keyboard navigation times out (6 tests)"
    priority: 60
    status: closed
    complexity: medium
    requires: []
    acceptance:
      - "All 6 lightbox keyboard navigation E2E tests pass reliably"
      - "Shift+Arrow events are handled within 5 seconds in E2E environment"
    testing:
      - "command: make test-e2e SPEC=lightbox.spec.ts"
    notes: |-
      Cannot reproduce: 3 consecutive runs of lightbox.spec.ts (24 tests each) passed with all Shift+Arrow tests completing in ~3s. Likely caused by resource contention during B-091 QA full suite run.
  - id: B-095
    title: "E2E: Dimension filtering combo filter tests fail (2 tests)"
    priority: 60
    status: closed
    complexity: low
    requires: []
    acceptance:
      - "Combo filter E2E tests pass reliably"
    testing:
      - "command: make test-e2e SPEC=dimension-filtering.spec.ts"
    notes: |-
      Closed as not reproducible. Tests pass reliably across 3 consecutive runs. The flakiness was likely caused by the same timing issues fixed by B-089 (savePresetViaDialog race condition) and B-091 (preset dirty tracking timing).
  - id: B-117
    title: "E2E: study-versioning spec returns HTTP 400 on PUT /api/studies"
    type: bug
    status: closed
    priority: 65
    complexity: low
    requires: []
    acceptance:
      - "PUT /api/studies/{id} returns 200 when updating steps with a valid payload"
      - "The study-versioning E2E spec passes reliably"
    testing:
      - "command: make test-e2e-serial SPEC=study-versioning.spec.ts"
    notes: |-
      E2E test study-versioning.spec.ts:89 fails with Expected: 200, Received: 400 on PUT.
      Root cause hypothesis: The study update payload is missing required fields (sampler_scheduler_pairs,
      workflow_template, etc.) or the backend validation logic changed and the test was not updated.
      Source: QA E2E sweep during B-115.

      Resolution: No code changes required. The failure was caused by transient E2E infrastructure instability
      (Docker DNS resolution, parallel shard contention) during the B-115 QA sweep (59 pre-existing failures).
      Prior fixes in B-108, B-111, B-112, B-113 resolved the underlying infrastructure issues. Three consecutive
      make test-e2e SPEC=study-versioning.spec.ts runs confirm the spec passes reliably (339/0/0 each).
  - id: B-119
    title: "E2E: debug-mode spec fails to find images in xy-grid for lightbox tests"
    type: bug
    status: closed
    priority: 65
    complexity: low
    requires: []
    acceptance:
      - "Debug mode lightbox overlay tests pass reliably"
      - "XY grid selectors in debug-mode.spec.ts match current component structure"
    testing:
      - "command: make test-e2e-serial SPEC=debug-mode.spec.ts"
    notes: |
      E2E test debug-mode.spec.ts:274 fails with selector '.xy-grid [role="gridcell"] img' not found.
      Root cause hypothesis: The grid selector no longer matches the current DOM structure after S-132
      XY axis sliders rework. Source: QA E2E sweep during B-115.
  - id: B-132
    title: "Validation passes with extra samples; no per-sample param verification"
    type: bug
    status: uat
    priority: 50
    complexity: medium
    requires: []
    notes: |
      Validation can pass when there are more samples in a sampleset than expected.
      This should trigger a validation failure. Additionally, validation currently
      only checks sample count, but should verify each sample has the exact expected
      params by checking manifest.json and per-sample JSON metadata files.
      Source: user bug report during grooming.
    acceptance:
      - "BE: Validation fails when sampleset has more samples than expected"
      - "BE: Validation checks each sample against manifest.json and per-sample JSON for exact param match"
      - "FE: Validation status correctly reflects per-sample param mismatches"
      - "BE: Unit tests for count-strict validation and param-level verification"
    testing:
      - "Test with samplesets containing extra samples (should fail validation)"
      - "Test with samples that have mismatched params vs manifest.json (should fail)"
      - "Verify validation passes only when count matches AND all params match"
  - id: S-134
    title: "Validation dialog: display detailed per-checkpoint report"
    type: enhancement
    status: uat
    priority: 50
    complexity: medium
    requires:
      - B-132
    notes: >
      Update the validation dialog frontend to display the detailed validation report
      returned by the reworked BE validation endpoint (B-132). Show per-checkpoint
      breakdowns with expected, valid, missing, and invalid counts for PNG, JSON metadata,
      and thumbnail files. Also display total summary counts and flag any extra unexpected
      files found.
    acceptance:
      - "FE: Validation dialog displays per-checkpoint breakdown (expected, valid, missing, invalid for each file type)"
      - "FE: Total summary row shows aggregate counts across all checkpoints"
      - "FE: Extra/unexpected files are flagged in the report"
      - "FE: Unit tests for report display with various validation states"
    testing:
      - "Test with validation reports containing mixed states: some checkpoints fully valid, some with missing files, some
        with param mismatches, and some with extra files"
      - "Verify the dialog handles empty reports (no checkpoints) gracefully"
  - id: B-135
    title: "Training run with no checkpoint sample dirs causes grid error"
    type: bug
    status: uat
    priority: 70
    complexity: low
    requires: []
    notes: >
      Selecting a training run whose sample set directory exists (with manifest.json)
      but has no checkpoint subdirectories causes a filesystem error to propagate to the
      frontend grid display. The backend should handle missing checkpoint dirs gracefully
      by logging a warning and returning empty images/dimensions.
    acceptance:
      - "BE: Scanning a training run with no checkpoint dirs returns empty images and dimensions instead of an error"
      - "BE: A warning is logged when checkpoint dirs are missing"
      - "FE: Grid displays empty state (no error) when training run has no samples"
      - "BE: Unit tests for missing checkpoint directory handling"
    testing:
      - "Test with a training run directory that has manifest.json but no checkpoint subdirectories"
      - "Verify no error propagates to the API response"
  - id: B-136
    title: "Colored beads not displayed when Training Run / Study selectors are closed"
    type: bug
    status: uat
    priority: 45
    complexity: low
    requires: []
    notes: >
      In Generate Samples, the Training Run and Study selectors show colored bead
      status indicators when expanded/open, but the beads are not visible when the
      selectors are in their closed/collapsed state. Beads should be visible in both
      states.
    acceptance:
      - "FE: Bead status indicators are visible on closed/collapsed Training Run selector"
      - "FE: Bead status indicators are visible on closed/collapsed Study selector"
      - "FE: Unit tests for bead rendering in both open and closed selector states"
    testing:
      - "Verify beads render correctly with various states (pending, complete, failed) in both open and closed selector positions"
  - id: S-135
    title: "Failed checkpoint indicator click navigates to failed job in Job List"
    type: enhancement
    status: uat
    priority: 55
    complexity: medium
    requires: []
    notes: >
      In Generate Samples, when a checkpoint shows a failure indicator, clicking it
      should close the Generate Samples dialog, open the Job List, and scroll to the
      specific failed job (expanding its failure details in the job card).
    acceptance:
      - "FE: Clicking failed checkpoint indicator closes Generate Samples dialog"
      - "FE: Job List opens and scrolls to the specific failed job"
      - "FE: Failed job card expands to show failure details"
      - "FE: Unit tests for navigation flow from failed checkpoint to job list"
    testing:
      - "Test the full navigation flow: click failure indicator, verify dialog closes, job list opens, correct job is scrolled
        into view with expanded failure details"
      - "Edge case: verify behavior when the failed job has been cleared from the list"
  - id: S-136
    title: "Generate Samples minor UI tweaks (whitespace + validation message)"
    type: enhancement
    status: todo
    priority: 30
    complexity: low
    requires: []
    notes: >
      Two small UI fixes in Generate Samples:
      1. Add left-margin whitespace between checkpoint name and sample count (e.g. "10/10")
      2. Change validation message "No checkpoints selected Select at least one checkpoint
         to regenerate" to red color and update text to "Select at least one checkpoint to generate"
    acceptance:
      - "FE: Visible whitespace (left-margin) between checkpoint name and sample count"
      - "FE: Validation message text is red and reads 'Select at least one checkpoint to generate'"
      - "FE: Unit tests for updated validation message text and styling"
    testing:
      - "Ensure the validation message appears when no checkpoints are selected and disappears when at least one is selected"
  - id: S-137
    title: "Validation dialog: add refresh button"
    type: enhancement
    status: uat
    priority: 35
    complexity: low
    requires: []
    notes: >
      Add a refresh button to the validation dialog that re-runs the validation
      API call and updates the displayed results without closing and reopening
      the dialog.
    acceptance:
      - "FE: Refresh button is visible in the validation dialog"
      - "FE: Clicking refresh re-triggers validation and updates displayed results"
      - "FE: Loading state is shown during refresh"
      - "FE: Unit tests for refresh button behavior"
    testing:
      - "Verify refresh re-fetches validation data and results update afterward"
      - "Test that loading state displays during the API call"
