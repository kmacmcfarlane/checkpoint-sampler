  - id: B-143
    title: "Base model dropdown depends on ComfyUI instead of base_model_dir"
    status: uat
    priority: 85
    complexity: medium
    requires: []
    notes: |
      The base model dropdown in the job launch dialog (S-148) fetches from ComfyUI's
      UNET model list via getComfyUIModels('unet'). When ComfyUI is offline, the
      dropdown is empty and LoRA jobs cannot be launched.

      The spike (docs/spike-lora-support.md section 13) specified a dedicated
      GET /api/base-models endpoint sourced from the base_model_dir config key
      (falling back to checkpoint_dirs[0]). This was never implemented — S-148
      took a shortcut and reused the ComfyUI proxy.

      Fix: implement the spike-specified endpoint and switch the frontend to use it.
      This removes the ComfyUI dependency for base model selection entirely.
    testing:
      - "BE: endpoint returns .safetensors files from base_model_dir recursively"
      - "BE: falls back to checkpoint_dirs[0] when base_model_dir is empty"
      - "BE: returns empty list gracefully when dir has no .safetensors files"
      - "FE: dropdown populates from new endpoint, not ComfyUI"
      - "FE: works when ComfyUI is offline"
    acceptance:
      - "BE: New GET /api/base-models endpoint scans base_model_dir for .safetensors files"
      - "BE: Falls back to checkpoint_dirs[0] when base_model_dir is not configured"
      - "BE: Goa DSL design, codegen, and tests pass"
      - "FE: Job launch dialog base model dropdown calls /api/base-models instead of ComfyUI UNET proxy"
      - "FE: Base model dropdown populates correctly when ComfyUI is offline"
      - "FE: Existing LoRA job launch flow unchanged (payload still includes base_model field)"
