  - id: B-146
    title: "SQLite pool allows concurrent writers — missing SetMaxOpenConns(1) causes SQLITE_BUSY write failures"
    priority: 90
    status: uat
    complexity: low
    requires: []
    notes: |
      backend/internal/store/db.go OpenDB() configures WAL + busy_timeout via DSN but
      never constrains the database/sql pool. modernc.org/sqlite permits one writer at
      a time; under concurrent load database/sql opens multiple connections. The job
      executor goroutine writes (UpdateSampleJobItem/UpdateSampleJob) concurrently with
      API handler writes (create job/study), and writer-vs-writer collisions on separate
      pooled connections surface as hard "database is locked" errors that the busy
      timeout does not reliably absorb. Verified: no SetMaxOpenConns call exists in
      non-test store code; db_test.go:72,116 set SetMaxOpenConns(5) which masks the
      issue in unit runs.

      Fix: call db.SetMaxOpenConns(1) in OpenDB (the standard remedy for
      database/sql + SQLite single-writer semantics). Update db_test.go so tests use
      the same pool configuration as production (remove the SetMaxOpenConns(5)
      overrides) — tests must not mask the production pool behavior.
    acceptance:
      - "BE: OpenDB constrains the connection pool to a single connection (SetMaxOpenConns(1))"
      - "BE: db_test.go no longer overrides the pool size to a value different from production"
      - "BE: a regression test exercises concurrent writes from multiple goroutines (e.g. parallel preset/job updates) and
        asserts no 'database is locked' error occurs"
    testing:
      - "command: make test-backend"
      - "Verify the new concurrent-write test fails when SetMaxOpenConns(1) is removed (run it once with the line commented
        out locally to prove the test has teeth), then passes with the fix"
      - "grep -rn 'SetMaxOpenConns' backend/ must show only the production call in db.go (tests may call it only with the
        same value)"
      - "command: make test-e2e (full suite green — job execution + study CRUD exercise concurrent writes)"

  - id: B-147
    title: "Sample job + items creation is not atomic — orphaned jobs with partial items on mid-loop failure"
    priority: 85
    status: uat
    complexity: medium
    requires: ["B-146"]
    notes: |
      backend/internal/service/sample_job.go creates the job row, then loops inserting
      item rows via separate store.CreateSampleJobItem calls (one db.Exec each), with
      manual compensation `_ = s.store.DeleteSampleJob(jobID)` at lines ~362/410/429 on
      failure. If the compensating delete fails or the process crashes mid-loop, an
      orphaned job persists whose total_items does not match its actual item count —
      the executor then waits forever on items that do not exist. There is no
      Begin/Commit anywhere in the store package except migrations (verified).

      Fix: add a store method that inserts the job and ALL its items in a single
      transaction (e.g. CreateSampleJobWithItems(job, items)), commit once, and remove
      the manual compensation path from the service layer. Keep the store entity
      separation intact (persistence entities stay in store).
    acceptance:
      - "BE: job + all item rows are inserted in one SQLite transaction; a failure during item insertion leaves no job row
        and no item rows behind"
      - "BE: the manual DeleteSampleJob compensation calls in service/sample_job.go are removed"
      - "BE: service layer calls a single store method for job+items creation (interface updated in the service package, per
        consumer-defined-interface rule)"
    testing:
      - "command: make test-backend"
      - "A store-level test injects a failure partway through item insertion (e.g. invalid item or closed DB) and asserts
        the job row is absent afterwards (SELECT COUNT(*) = 0 for both tables)"
      - "A test asserts the happy path persists job.total_items == COUNT(sample_job_items WHERE job_id)"
      - "command: make test-e2e (job creation/launch specs green)"

  - id: B-148
    title: "completed_items counter races (lost updates) and diverges between job list and detail views"
    priority: 75
    status: uat
    complexity: medium
    requires: ["B-147"]
    notes: |
      backend/internal/service/job_executor.go (~line 1725) updates the stored
      completed_items counter via get-modify-write (GetSampleJob -> mutate ->
      UpdateSampleJob) with no transaction, so concurrent completions lose updates.
      The list endpoint surfaces the stored counter while the show endpoint recomputes
      counts from items, so the two views diverge.

      Fix: make the counter derived/atomic — either update it inside the same
      transaction that flips the item status, or use a single
      `UPDATE sample_jobs SET completed_items = (SELECT COUNT(*) FROM sample_job_items
      WHERE job_id = ? AND status = 'completed')` statement. The recomputed value must
      be authoritative everywhere; list and show must agree.
    acceptance:
      - "BE: completed_items can never drift from the actual count of completed items (atomic update or derived value)"
      - "BE: list and show endpoints report identical progress for the same job state"
      - "BE: no get-modify-write of completed_items remains in job_executor.go"
    testing:
      - "command: make test-backend"
      - "A test drives concurrent item completions (goroutines) and asserts the final counter equals the completed item count
        exactly"
      - "A test asserts list-vs-show progress parity for a job with mixed item statuses (completed/failed/pending)"
      - "command: make test-e2e (job progress specs green)"

  - id: B-149
    title: "Job list endpoint loads every item row of every job (N+1) and sample_job_items has no indexes"
    priority: 70
    status: uat
    complexity: medium
    requires: ["B-148"]
    notes: |
      backend/internal/api/sample_jobs.go:50 calls svc.GetProgress(j.ID) per job in
      List; GetProgress loads ALL item rows for the job into memory to count statuses.
      The UI polls this endpoint, so every poll costs O(total items across all jobs).
      Verified: migrations.go contains exactly one index (idx_studies_name_unique) —
      sample_job_items has no index on job_id, so every item query is a full table scan.

      Fix (scope agreed with user — NO pagination):
      1. Replace the per-job item loading with a single aggregate query
         (SELECT job_id, status, COUNT(*) ... GROUP BY job_id, status) or per-job
         aggregate; list rendering must never load full item rows.
      2. Add a migration creating indexes on sample_job_items(job_id) and
         sample_job_items(job_id, status); consider (job_id, created_at) for the
         ordered item-listing path used by the executor.
    acceptance:
      - "BE: listing jobs performs aggregate COUNT queries only — no full item-row loading in the list path"
      - "BE: a forward migration adds an index on sample_job_items(job_id) and (job_id, status)"
      - "BE: list progress values are identical to the previous behavior for the same data (parity with show, per B-148)"
      - "BE: explicitly out of scope: pagination (deferred by decision 2026-06-09)"
    testing:
      - "command: make test-backend"
      - "A store test verifies the aggregate counts match a fixture of mixed-status items"
      - "Migration test (or migration-runner assertion) confirms the new indexes exist in sqlite_master after migrating an
        existing DB"
      - "command: make test-e2e (job progress panel specs green)"

  - id: B-150
    title: "ComfyUI WebSocket read loop has no read deadline — half-open connection hangs jobs forever"
    priority: 80
    status: uat
    complexity: medium
    requires: []
    notes: |
      backend/internal/store/comfyui_ws.go readLoop (~line 230) calls conn.ReadMessage()
      with no SetReadDeadline and no ping/pong keepalive (verified: no SetReadDeadline,
      SetPongHandler, or client-side ping in the file). If the ComfyUI TCP connection
      half-opens (Wi-Fi drop, host poweroff without RST), ReadMessage blocks forever,
      `connected` stays true, the reconnect ticker skips reconnection (it only fires
      when !connected), and the in-flight job item hangs indefinitely with no
      completion or failure.

      Fix: implement client-side ping/pong keepalive — send periodic pings, set a read
      deadline refreshed on every successful read/pong, and on deadline expiry close
      the connection so the existing disconnectHandler fires and reconnect/recovery
      (recoverStuckItems) takes over. Intervals should be modest (e.g. ping every 30s,
      read deadline 60-90s) and must tolerate long GPU-bound generations during which
      ComfyUI sends no execution events (pings/pongs still flow).
    acceptance:
      - "BE: a dead/half-open ComfyUI connection is detected within a bounded interval (deadline expiry) and triggers the
        disconnect handler"
      - "BE: long idle periods on a HEALTHY connection (no execution events for minutes) do NOT cause spurious disconnects
        (pong refreshes the deadline)"
      - "BE: after detection, existing reconnect logic re-establishes the connection and stuck-item recovery proceeds"
    testing:
      - "command: make test-backend"
      - "A unit test with a stub WS server verifies: (a) deadline expiry on silent peer triggers disconnect callback; (b)
        pong responses keep the connection alive past the deadline window"
      - "Verify no test uses time.Sleep as the sole synchronization for these assertions (use channels/Eventually)"
      - "command: make test-e2e (inference specs against the stub ComfyUI still green)"

  - id: B-151
    title: "Single 10s HTTP timeout on all ComfyUI calls — image downloads fail and completed generations are lost"
    priority: 65
    status: uat
    complexity: low
    requires: []
    notes: |
      backend/internal/store/comfyui_client.go sets http.Client{Timeout: 10s} which
      bounds the ENTIRE request including body read, for all operations. DownloadImage
      reads the full image via io.ReadAll; a large PNG or a GPU-loaded ComfyUI that
      takes >10s to stream the body fails the download, the item is marked failed, and
      the already-generated image is lost. GetHistory can also time out during
      recovery on a busy instance.

      Fix: remove the client-wide Timeout and use per-call context.WithTimeout with
      operation-appropriate budgets (e.g. 10s for status/object_info, 60-120s for
      DownloadImage and GetHistory). All calls must still honor caller ctx cancellation.
    acceptance:
      - "BE: image downloads use a substantially longer timeout than control-plane calls (values documented in code)"
      - "BE: every ComfyUI HTTP call has an explicit per-call timeout (no unbounded calls; no single client-wide Timeout governing
        downloads)"
      - "BE: context cancellation from the caller still aborts in-flight requests"
    testing:
      - "command: make test-backend"
      - "A test with a slow stub server proves a download exceeding the old 10s budget now succeeds, and a control-plane call
        to a hung server still fails fast"
      - "command: make test-e2e"

  - id: B-152
    title: "recoverStuckItems races the executor ticker — duplicate ComfyUI submissions after reconnect"
    priority: 60
    status: uat
    complexity: high
    requires: ["B-150"]
    notes: |
      backend/internal/service/job_executor.go (~lines 262-368): on reconnect,
      recoverStuckItems runs in its own goroutine and can reset an item to pending
      based on a stale snapshot while the ticker goroutine (processNextItem) has
      concurrently re-submitted that same item with a new prompt ID. The window:
      disconnect clears activeItemID, ticker re-submits a pending item, near-simultaneous
      reconnect recovery still sees the item 'running' with the OLD prompt ID and
      resets it — orphaning the in-flight prompt and causing duplicate submission.

      Fix: recovery must re-read each item's current state under e.mu immediately
      before mutating, and only reset items whose stored prompt ID matches the
      pre-disconnect snapshot (compare-and-act under lock). Schedule after B-150 since
      deadline-triggered disconnects make this path much more common.

      Related cleanup (fold in): the stopRequested field (lines ~94/659/2245/2275) is
      read but only ever set false — dead state masquerading as a cooperative-stop
      guard. Remove it or wire it correctly as part of touching this lifecycle code.
    acceptance:
      - "BE: recovery never resets an item that has been re-submitted with a newer prompt ID (verified under lock at mutation
        time)"
      - "BE: no duplicate ComfyUI submission occurs when disconnect+reconnect overlaps the ticker's re-submission"
      - "BE: stopRequested dead state is removed or made functional (no unreachable guard remains)"
    testing:
      - "command: make test-backend"
      - "A deterministic interleaving test (channels/locks, not sleeps) drives: disconnect -> ticker re-submission -> reconnect
        recovery, asserting exactly one active submission and no pending-reset of the re-submitted item"
      - "Race detector is part of the suite (ginkgo --race via make test-backend) and must be green"
      - "command: make test-e2e"

  - id: B-153
    title: "fsnotify watches leak on every training-run switch — live updates eventually stop"
    priority: 75
    status: uat
    complexity: medium
    requires: []
    notes: |
      backend/internal/service/watcher.go: WatchTrainingRun calls notifier.Add(dir) for
      the new run's directories (lines ~136, 235 for dynamically-added dirs) but never
      calls notifier.Remove for directories registered by the previous run (verified:
      the fsnotifyAdapter exposes Remove but it has zero call sites). The single shared
      fsnotify.Watcher accumulates inotify watch descriptors on every run switch until
      max_user_watches is hit, after which Add fails (logged, swallowed) and live
      updates silently break; stale watches also keep firing events into the loop.

      Fix: track the set of currently-watched directories on the Watcher and remove
      them all in stopLocked() (or before re-adding the new set) when switching runs.
    acceptance:
      - "BE: switching training runs removes all previously-added watches (including dynamically-added per-image-directory
        watches) before adding new ones"
      - "BE: the watcher tracks its active watch set; repeated run switches do not grow the underlying watch count"
      - "BE: events from the previous run's directories are no longer delivered after a switch"
    testing:
      - "command: make test-backend"
      - "A unit test with the mock notifier asserts Remove is called for every previously Added dir on switch, and that after
        N switches the tracked watch set equals only the current run's dirs"
      - "A test asserts no event from an old-run directory reaches subscribers after switching (synchronized via sentinel
        events, not sleeps)"
      - "command: make test-e2e (live-update specs green)"

  - id: B-154
    title: "Frontend WebSocket composable leaks connection and listeners on unmount/HMR"
    priority: 65
    status: uat
    complexity: low
    requires: []
    notes: |
      frontend/src/composables/useWebSocket.ts registers onConnectionChange/onEvent
      listeners and creates the WSClient but has no onUnmounted/onScopeDispose cleanup
      (verified: neither appears in the file) and never disconnects on scope teardown.
      App.vue manually removes only the job/inference listeners it registered itself.
      On unmount (HMR in dev, future remount), the socket stays open and the
      exponential-backoff reconnect timer keeps firing doConnect() forever against a
      dead consumer, accumulating zombie connections.

      Fix: useWebSocket registers onScopeDispose (or onUnmounted) that removes its own
      listeners and calls wsClient.disconnect() (which must also cancel any pending
      reconnect timer); App.vue should not need manual WS teardown.
    acceptance:
      - "FE: disposing the component scope that owns useWebSocket closes the socket, cancels pending reconnect timers, and
        deregisters all listeners the composable added"
      - "FE: WSClient.disconnect() cancels a scheduled reconnect (no doConnect fires after disconnect)"
      - "FE: App.vue no longer performs partial manual cleanup that duplicates the composable's responsibility"
    testing:
      - "command: cd frontend && npx vitest run"
      - "A test mounts a component using useWebSocket, unmounts it, advances fake timers past the reconnect backoff, and asserts
