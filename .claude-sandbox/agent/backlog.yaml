  - id: R-015
    title: "Replace string-matched error handling with typed errors; stop leaking absolute paths in API errors"
    priority: 55
    status: todo
    complexity: medium
    type: refactor
    requires: ["B-149", "B-152"]
    notes: |
      Two related violations of DEVELOPMENT_PRACTICES 3.2:
      1. API handlers map service errors to HTTP statuses via
         strings.Contains(err.Error(), ...) — api/checkpoints.go:27,
         images_service.go:122, presets.go:126, training_runs.go:127. Rewording a
         message silently changes status codes.
      2. job_executor.go isConnectionError (~2333) substring-matches lowercased error
         text ("timeout","network","eof") — a ComfyUI node error mentioning 'network'
         triggers a bogus reconnect cycle.
      Also: several service errors embed absolute host paths that can surface through
      API responses (e.g. validation.go manifest-not-found) — sanitize at the API
      mapping boundary.

      Fix: introduce typed/sentinel errors in the service layer (errors.Is/As),
      switch API mapping to them; replace isConnectionError with net.Error.Timeout(),
      errors.Is(context.DeadlineExceeded), *net.OpError/syscall checks. Ensure API
      error messages never contain absolute server paths. Requires B-149/B-152 (same
      files churn first).
    acceptance:
      - "BE: no strings.Contains(err.Error(), ...) remains in internal/api or internal/service (grep-verifiable, excluding
        tests)"
      - "BE: HTTP status mapping driven by errors.Is/As on sentinel/typed errors"
      - "BE: connection-error classification uses typed checks, with a test proving a node error containing the word 'network'
        is NOT classified as a connection error"
      - "BE: API error responses contain no absolute filesystem paths (paths allowed only in server logs)"
    testing:
      - "command: make test-backend"
      - "grep -rn 'Contains(err.Error' backend/internal --include='*.go' | grep -v _test returns nothing"
      - "Mapping tests per endpoint: not-found -> 404, validation -> 400, internal -> 500 driven by sentinel errors"
      - "command: make test-e2e"

