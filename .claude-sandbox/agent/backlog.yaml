        findComponent(NTooltip) over native selectors."
  - id: B-161
    title: "Checkpoint slider omits the final epoch (100) — assignFinalCheckpointStep only recognizes 'steps-N' in the run
      name, not 'epochs-N'"
    status: uat
    priority: 65
    complexity: low
    requires: []
    notes: |
      A LoRA training run has per-epoch checkpoints plus a final unsuffixed checkpoint:
        bidi-...-epochs-100-1024-b1d1.safetensors            (final = epoch 100, NO suffix)
        bidi-...-epochs-100-1024-b1d1-000090.safetensors     (epoch 90)
        ... down to -000010.safetensors                       (epoch 10)
      The checkpoint slider only goes up to epoch 90; the final epoch-100 checkpoint is
      missing.

      Root cause (backend, internal/service/discovery.go):
        - extractStepNumber returns -1 for the final unsuffixed checkpoint (no -NNNNNN
          epoch suffix, no -stepN suffix).
        - assignFinalCheckpointStep (discovery.go ~line 312) then tries to place the final
          checkpoint by (a) taking maxStep from the numbered checkpoints = 90, and
          (b) scanning the run name with regexp `steps?-(\d+)` for a larger value.
        - This run's name contains "epochs-100", NOT "steps-100". The `steps?-(\d+)` regex
          does not match "epochs-100" (no "step" substring), so maxStep stays 90 and the
          final checkpoint is assigned StepNumber = 90 — colliding with the real -000090
          checkpoint. Epoch 100 is therefore never represented and the slider caps at 90.

      Fix: extend assignFinalCheckpointStep to also recognize an epoch count in the run
      name (e.g. `epochs?-(\d+)`) in addition to `steps?-(\d+)`, taking the max. Then the
      final unsuffixed checkpoint is assigned StepNumber = 100 and sorts after epoch 90,
      so it appears on the slider. Keep the existing steps-N behavior intact.

      Watch-outs:
        - The numbered epoch suffix is 6 zero-padded digits (-000090 -> 90). The run-name
          token is the plain integer (epochs-100 -> 100). Both must map to comparable
          StepNumber values (they already do: 90 vs 100).
        - Guard against false positives: the token must be the epoch/step COUNT, not other
          run-name numbers (dim-32, alpha-32, lr-5e-5, 1024). `epochs?-(\d+)` and
          `steps?-(\d+)` are specific enough; verify against this exact run name.
        - Behavior when a run name has neither steps-N nor epochs-N is unchanged (final
          checkpoint keeps the maxStep fallback).
    acceptance:
      - "BE: assignFinalCheckpointStep recognizes an 'epochs-N' (and 'epoch-N') token in the run name in addition to 'steps-N',
        using the maximum of the detected values"
      - "BE: for the reported run (numbered epochs 10..90 + final unsuffixed, name contains 'epochs-100'), the final checkpoint
        is assigned StepNumber 100 and does not collide with the epoch-90 checkpoint"
      - "BE: the final epoch-100 checkpoint sorts last (after epoch 90) in the discovered checkpoint list"
      - "BE: regression test uses the exact reported filename set and asserts the resulting checkpoint step numbers are 10,20,...,90,100
        with the unsuffixed file mapped to 100"
      - "BE: existing 'steps-N' run-name detection and the no-token maxStep fallback are unchanged (covered by test)"
      - "FE/E2E: confirm the checkpoint slider surfaces the epoch-100 checkpoint for such a run (no code change expected if
        it renders from discovered checkpoints)"
    testing:
      - "Table-driven test over run-name variants: 'epochs-100', 'epoch-100', 'steps-9000', and a name with neither (fallback).
        Assert the unsuffixed final checkpoint gets the correct StepNumber and that a run whose name has BOTH a smaller numbered
        max and a larger epochs-N resolves to the epochs-N value. Include a guard case proving dim-32/alpha-32/lr/1024 tokens
        are not mistaken for the epoch count. Use the exact reported filename list as the primary fixture."
  - id: S-161
    title: "Queue sample jobs when ComfyUI is offline; resolve checkpoint paths lazily at execution"
    status: uat
    priority: 65
    complexity: medium
    requires: []
    notes: |
      Today CreateSampleJob (sample_job.go:412-455) eagerly path-matches every item
      against ComfyUI's live /object_info at creation. If ComfyUI is unreachable, every
      item fails matching, skippedCount == len(items), and creation aborts with the
      misleading "all N items failed checkpoint path matching — no checkpoints could be
      resolved in ComfyUI" — which implies the checkpoints are missing when really
      ComfyUI is just down.

      Investigation confirmed: path matching is the ONLY ComfyUI query at creation;
      nothing else about creating a job needs ComfyUI. The executor already tolerates
      ComfyUI being offline (reconnect ticker; processNextItem skips while !connected;
      stuck-item recovery on reconnect), and lazy re-matching already exists in RetryJob
      (sample_job.go:800-843). So resolution can move from creation-time to execution-time.

      Plan: create the job in pending with unresolved model paths; resolve
      ComfyUIModelPath/LoraModelPath lazily in processItem when empty (reuse the retry
      matcher call). Wire the checkpoint + LoRA PathMatcher into the executor (it
      currently has only baseModelMatcher). Distinguish connection errors from genuine
      misses: unreachable -> leave item pending (executor waits/reconnects); ComfyUI up
      but checkpoint absent -> fail that item (job -> completed_with_errors, same as
      today's retry path).
    acceptance:
      - "BE: creating a job while ComfyUI is unreachable succeeds and persists a pending job with items (no eager path-match
        rejection)"
      - "BE: path matching happens at execution time in processItem for items with empty model paths (checkpoint and LoRA)"
      - "BE: a connection error during execution-time matching leaves the item pending (not failed) and triggers the existing
        disconnect/reconnect path, so the item is retried when ComfyUI returns"
      - "BE: ComfyUI reachable but checkpoint genuinely absent fails only that item with a clear per-item message; the job
        completes with errors"
      - "BE: the misleading 'all items failed checkpoint path matching' whole-job rejection is removed (or only fires for
        a non-connection reason with honest wording)"
      - "FE: the launch dialog no longer surfaces the 'no checkpoints could be resolved' error when ComfyUI is offline; the
        job appears queued/pending"
      - "E2E: with ComfyUI stopped, launching a job creates a pending job that begins processing once ComfyUI is reachable"
    testing:
      - "Exercise the offline-create -> reconnect -> drain path deterministically (fake models provider returning connection
        error then success)"
      - "Distinguish connection-error vs checkpoint-absent at execution time; cover both checkpoint and LoRA jobs"
      - "Verify no orphaned/duplicate submissions when reconnect overlaps the executor ticker (relates to B-152)"
  - id: B-162
    title: "Job progress Completeness section reports 0/N missing for LoRA jobs — completeness check and manifest write omit
      the base_model directory level"
    status: uat
    priority: 50
    complexity: low
    requires: []
    notes: |
      Observed in the dev environment: a running sample job for the training run
      qwen/training/bidi-v0.3-qwen-2512-dim-32-alpha-32-lr-7e-5-epochs-100-1024-b1d1
      shows overall progress at checkpoint 8/10, but the JobProgressPanel
      "Completeness:" section reports 0/72 -- 72 missing for every completed
      checkpoint (000010 through 000090). The images ARE on disk; only the
      completeness report is wrong.

      Root cause: the executor computes the study output directory in three places
      and they disagree about whether a base_model level is present.

        - WRITE (internal/service/job_executor_conn.go:593-596) — correct:
            studyOutputDir = SanitizeTrainingRunName(job.TrainingRunName) + "/" + job.StudyName
            if job.BaseModel != "" { studyOutputDir += "/" + basename-without-ext(job.BaseModel) }
          Images land at {sampleDir}/{run}/{study}/{base_model}/{checkpoint}/*.png

        - COMPLETENESS CHECK (internal/service/job_executor_progress.go:366) — wrong:
            studyOutputDir = SanitizeTrainingRunName(job.TrainingRunName) + "/" + job.StudyName
          No base_model level. verifyCheckpointCompleteness (job_executor_progress.go:200,224)
          then stats {sampleDir}/{run}/{study}/{checkpoint}, which does not exist for a
          LoRA job, logs "checkpoint sample directory does not exist during completeness
          check", and records Verified: 0 / Missing: <expected>.

        - MANIFEST WRITE (internal/service/job_executor_workflow.go:455) — also wrong:
            same naive reconstruction, so manifest.json is written one directory ABOVE
            the images for LoRA jobs ({run}/{study}/manifest.json instead of
            {run}/{study}/{base_model}/manifest.json). This likely also defeats
            ValidateTrainingRunWithManifest for those runs (falls back to count-based
            validation because ErrManifestNotFound).

      Overall job progress is unaffected because it counts sample_job_items rows in the
      DB, not files on disk — which is exactly why progress and completeness disagree.

      This is the same defect class as B-160, which fixed the naive
      sanitize(run)/study reconstruction in the /validate endpoint (via
      resolveStudyOutputDir) but did not touch the executor. Fix: extract a single
      helper (e.g. service.StudyOutputDirForJob(job) or a method on JobExecutor) that
      applies the base_model level, and route all three call sites through it so they
      cannot diverge again. Grep for `SanitizeTrainingRunName(job.TrainingRunName)` to
      confirm no fourth site exists.

      Note: non-LoRA jobs (job.BaseModel == "") are unaffected — the two paths coincide.
    acceptance:
      - "BE: A single shared helper computes the job's study output directory, including the base_model level when job.BaseModel
        is non-empty."
      - "BE: job_executor_conn.go (image write), job_executor_workflow.go (manifest write), and job_executor_progress.go (completeness
        check) all obtain the study output directory from that helper; no call site reconstructs it inline."
      - "BE: For a LoRA job (BaseModel set), verifyCheckpointCompleteness reads {sampleDir}/{run}/{study}/{base_model}/{checkpoint}/
        and reports Verified == Expected when all images are present."
      - "BE: For a LoRA job, manifest.json is written to the same directory that contains the checkpoint image subdirectories."
      - "BE: For a non-LoRA job (BaseModel empty), the resolved path is unchanged from today's behaviour."
      - "E2E: A completed sample job for a run with a base model shows N/N verified in the Completeness section of the job
        progress panel, with no 'missing' lines."
    testing:
      - "BaseModel set vs empty — the empty case must NOT gain a trailing slash or an empty path segment."
      - "BaseModel values with an extension (foo.safetensors) and without (foo) must produce the same directory name."
      - "BaseModel given as an absolute path — only the basename is used, mirroring the filepath.Base defensive handling already
        present for checkpoints (B-115)."
      - "TrainingRunName containing slashes (the reported run is qwen/training/...) — sanitization to underscores must still
        happen exactly once."
      - "Manifest relocation: confirm ValidateTrainingRunWithManifest now finds the manifest for a LoRA run rather than falling
        back to count-based validation via the ErrManifestNotFound path in internal/api/training_runs.go."
      - "Sample sets written before this fix have manifest.json at the OLD location. Decide and state explicitly whether a
        read-side fallback to the old path is needed, or whether stale manifests are acceptable — do not leave this ambiguous."
      - "Completeness results are memoised in e.checkpointCompleteness keyed by checkpoint; verify a wrong cached entry cannot
        survive within a single job run."
