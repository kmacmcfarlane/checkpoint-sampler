  - id: S-179
    title: "Generate Samples: default base model from checkpoint ss_ metadata for fresh LoRA runs"
    type: story
    status: uat
    priority: 55
    complexity: medium
    requires: []
    notes: |
      In frontend/src/components/JobLaunchDialog.vue the base-model select
      (data-testid="base-model-field", LoRA-only, template ~1550-1565) gets its
      default from applyRememberedBaseModel (~1088-1112), which reads
      StudyAvailability.base_models — i.e. the base model that produced EXISTING
      samples (derived from the sample path {run}/{study}/{base_model}/{checkpoint}).
      A fresh run has no prior samples, so no base model is pre-selected.

      Goal: for a fresh LoRA run, default-select the base model the run was trained
      against, read from the checkpoint's safetensors ss_ metadata. Scope is
      frontend-only — the endpoint already exists: client.getCheckpointMetadata(filename)
      -> { metadata: Record<string,string> } of ss_* fields
      (GET /api/checkpoints/{filename}/metadata, api/client.ts:133-136).

      Implementation notes:
      - Only for LoRA runs (isLoraRun) with no remembered base model already applied;
        never override an existing/user selection (keep applyRememberedBaseModel
        precedence — remembered-from-samples wins when present).
      - Fetch metadata for one checkpoint of the selected run (e.g. the first/latest),
        extract a base-model reference preferring ss_sd_model_name, then
        ss_pretrained_model_name_or_path, then ss_base_model_version.
      - Match by basename (strip directory + .safetensors, case-insensitive) against
        baseModelOptions (fetched via getBaseModels from base_model_dir). Pre-select on
        a confident match; if nothing matches, leave unselected (best-effort — do not
        guess).
      - Guard against the metadata call failing or returning no ss_ fields (leave
        unselected, no error surfaced to the user beyond existing handling).
    acceptance:
      - "FE: opening Generate Samples for a fresh LoRA run pre-selects the base model whose basename matches the checkpoint
        ss_ metadata (ss_sd_model_name / ss_pretrained_model_name_or_path / ss_base_model_version), when a base_model_dir
        entry matches"
      - "FE: when no ss_ metadata match is found (or metadata is missing), the base model is left unselected — no incorrect
        guess and no error to the user"
      - "FE: an existing base-model selection (remembered from prior samples, or user-chosen) is never overridden by the metadata
