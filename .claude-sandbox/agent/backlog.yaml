        - Full text lives in the active Study's prompts: NamedPrompt[] (name + text) —
          src/api/types.ts. The name->text lookup must be sourced from the study and
          threaded into XYGrid (prop or store getter), then a Map(name -> text) built.
        - Only the PROMPT dimension headers get the tooltip. Non-prompt dimensions (steps,
          cfg, sampler, etc.) must NOT show a prompt tooltip. Gate on the header's
          dimension being the prompt dimension (dimension name === 'prompt' / 'prompt_name').
