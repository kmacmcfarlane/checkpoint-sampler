  - id: B-155
    title: "Image preloader never reacts to combo-filter changes and restarts full preload on every retrigger"
    priority: 60
    status: uat
    complexity: medium
    type: bug
    requires: []
    notes: |
      frontend/src/composables/useImagePreloader.ts (~line 210): the watch over
      [images, xDimension, yDimension, sliderDimension, comboSelections] has no
      deep:true (verified). In production comboSelections is a computed returning the
      same reactive object identity; filter changes mutate keys INSIDE it, so the
      watch never fires for combo changes and newly-visible cells are not prioritized
      — the instant-slider guarantee silently degrades. The unit test masks this by
      reassigning a plain ref.

      Second defect, same file: each retrigger calls preloaded.clear() and restarts
      the entire sequential preload over all images, re-creating Image() objects for
      URLs already cached; the in-flight image is not aborted either.

      Fix: (1) make the watch actually fire on combo-selection mutations (deep watch
      on a getter, or watch a serialized signature). (2) Stop clearing the preloaded
      set wholesale — rely on the existing has(url) skip guard so only new URLs load.
      Update the masking unit test to mutate the object in place the way the store does.
    acceptance:
      - "FE: changing only a combo filter retriggers preload prioritization for newly-visible cells"
      - "FE: already-preloaded URLs are not re-fetched on retrigger (preloaded set survives across cycles)"
      - "FE: the existing preloader unit test is updated to mutate comboSelections in place (mirroring the store) so it would
        catch the dead-watch regression"
    testing:
      - "command: cd frontend && npx vitest run"
      - "A test mutates a key inside comboSelections (without reassigning the object) and asserts the preload cycle re-runs"
      - "A test asserts a URL preloaded in cycle 1 is skipped (no new Image creation) in cycle 2"

  - id: B-156
    title: "Metadata parsers allocate up to 100MB from corrupt-file-declared lengths; guard branches untested"
    priority: 55
    status: uat
    complexity: low
    type: bug
    requires: []
    notes: |
      backend/internal/service/checkpoint_metadata.go:150 caps the safetensors header
      length at 100MB and then does make([]byte, headerLen) before io.ReadFull — a
      corrupt/malicious file declaring a near-cap length triggers an eager ~100MB
      allocation per request even when the file is tiny. image_metadata.go:241 has the
      same generous 100MB cap per PNG chunk. Real safetensors headers are KBs to low
      MBs. The >cap rejection branch has no test (QA review confirmed).

      Fix: lower the safetensors header cap to 16MB and validate headerLen against the
      actual file size (Stat) before allocating; lower the PNG chunk cap similarly
      (16MB is ample for tEXt/iTXt metadata chunks). Add tests for the rejection
      branches with crafted length prefixes.
    acceptance:
      - "BE: safetensors header cap reduced to 16MB and headerLen validated against file size before allocation"
      - "BE: PNG metadata chunk cap reduced to 16MB"
      - "BE: a crafted file declaring a length over the cap is rejected with a clear error and no large allocation"
      - "BE: a crafted file declaring a length larger than the file itself is rejected before allocation"
    testing:
      - "command: make test-backend"
      - "New tests cover: over-cap header length, header length exceeding file size, over-cap PNG chunk — all asserting the
        error path"
      - "Existing valid-metadata tests still pass (no false rejection of real fixtures, including W-009 fixtures)"

  - id: B-157
    title: "Shutdown race: HTTP server Shutdown runs concurrently with deferred close of store/watcher/executor"
    priority: 45
    status: uat
    complexity: low
    type: bug
    requires: []
    notes: |
      backend/cmd/server/main.go (~line 305): srv.Shutdown runs in a goroutine while
      run()'s LIFO defers (st.Close, notifier.Close, watcher.Stop, fsState.Stop,
      jobExecutor.Stop) fire on return — nothing guarantees Shutdown completes before
      the DB and services close, so in-flight requests can touch a closed store during
      shutdown.

      Fix: block until srv.Shutdown returns (done channel or errgroup) before run()
      returns, and stop the job executor + watcher explicitly before closing the DB so
      the ordering is deliberate rather than incidental defer order.
    acceptance:
      - "BE: run() does not return (and defers do not fire) until srv.Shutdown has completed"
      - "BE: shutdown order is explicit: stop executor and watcher, drain HTTP, then close DB/notifiers"
      - "BE: a SIGTERM during an in-flight request does not produce closed-DB errors"
    testing:
      - "command: make test-backend"
      - "command: cd backend && make build (compile check)"
      - "Manual-equivalent automated check: a test (or e2e teardown assertion) sends SIGTERM while a slow request is in flight
        and asserts a clean exit with no 'database is closed' log lines; if not feasible as unit test, the QA agent must verify
        via make test-e2e logs sweep showing no closed-DB errors during stack teardown"

