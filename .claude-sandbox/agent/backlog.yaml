      - "BE: config key max_study_items parsed with default 50000; <=0 rejected at config load"
      - "BE: a minimal endpoint exposes the configured limit to the frontend"
      - "FE: the launch dialog disables launch and shows total vs limit when the computed total exceeds the limit fetched
