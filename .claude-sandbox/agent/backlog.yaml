  - id: S-150
    title: "Limit HTTP request body size (200MB default) with config override"
    priority: 70
    status: uat
    complexity: low
    requires: []
    notes: |
      No request body limit exists anywhere: cmd/server/main.go sets only Read/Write
      timeouts and api/http.go wires no MaxBytesHandler, so Goa's json.Decode buffers
      arbitrarily large bodies (memory-exhaustion DoS from any LAN device).

      Decision (user, 2026-06-09): default limit 200MB, overridable via a new config
      key. Add `max_request_size_mb` to config.yaml schema (backend/internal/config/
      config.go yamlConfig -> model.Config, default 200 when unset), wrap the root
      handler in http.MaxBytesHandler sized from config, and set srv.MaxHeaderBytes to
      a sane fixed value (e.g. 1MB). Update config.yaml.example with a commented entry
      and doc comment. NOTE: the user's local config.yaml has already been updated with
      max_request_size_mb: 200 (it is gitignored — do not look for it in worktrees).
    acceptance:
      - "BE: requests with bodies over the configured limit are rejected with 413 and a normalized error body, not buffered
        into memory"
      - "BE: config key max_request_size_mb parsed with default 200; 0/negative values rejected at config validation"
      - "BE: config.yaml.example documents the new key with default noted"
      - "BE: MaxHeaderBytes set on the server"
    testing:
      - "command: make test-backend"
      - "Config tests cover: unset (default 200), explicit override, invalid value rejection"
      - "An API-level test posts a body just over a small configured limit and asserts 413; just under passes"
      - "command: make test-e2e (no regression — normal payloads unaffected)"

  - id: S-151
    title: "Restrict WebSocket origin and CORS to same-host with allowed_origins config override"
    priority: 65
    status: uat
    complexity: medium
    requires: ["S-150"]
    notes: |
      backend/internal/api/http.go:131 sets CheckOrigin to always-true and :298 applies
      CORSMiddleware("*"). Any webpage in a LAN user's browser can connect to /api/ws
      (WebSocket bypasses CORS) and stream prompts/model names/paths, or make
      cross-origin API mutations; DNS rebinding extends reach beyond the LAN.

      Decision (user, 2026-06-09): default behavior = allow only origins whose HOST
      matches the request Host header, comparing hostname only (ignore scheme and
      port) so IP access, dev ports, and the user's Caddy reverse proxy
      (checkpoint-sampler.mcfacehead.com — Caddy preserves the Host header by default)
      all work. New optional config key `allowed_origins` (list of origins or
      hostnames) extends the allowlist for setups where the proxy rewrites Host.
      Requests with NO Origin header (curl, non-browser clients, same-origin
      navigations) must remain allowed. Apply the same policy to both the WS upgrader
      CheckOrigin and the CORS middleware (echo the allowed origin instead of *).
      Update config.yaml.example. Requires S-150 (both touch http.go + config plumbing).
    acceptance:
      - "BE: WS upgrade and CORS allow: no-Origin requests, origins whose hostname equals the request Host hostname, and origins
        matching allowed_origins entries"
      - "BE: cross-host origins are rejected (WS upgrade refused; CORS headers absent so browser blocks reads)"
      - "BE: allowed_origins config key parsed (optional, default empty) and documented in config.yaml.example"
      - "FE: no frontend changes needed in default deployments (same-host and Caddy-proxied setups keep working) — verify
        dev mode (Vite port differs, host same) still connects"
    testing:
      - "command: make test-backend"
      - "Table-driven tests for the origin policy: no Origin, same host different port, same host different scheme, different
        host, allowed_origins match, allowed_origins miss"
      - "command: make test-e2e (the E2E stack accesses the backend cross-port — full suite green proves same-host policy
        doesn't break the harness)"
      - "Verify in e2e that the WS connection still establishes (live-update specs)"

  - id: S-152
