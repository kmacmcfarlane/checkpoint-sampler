# E2E test fixture configuration with ComfyUI mock enabled.
# Used by docker-compose.test.yml when running the sample generation E2E test.
# Points to the comfyui-mock service which provides a lightweight HTTP+WS stub.

checkpoint_dirs:
  - /data/checkpoints

lora_dirs:
  - /data/loras

sample_dir: /data/samples

port: 8080
ip_address: "0.0.0.0"

db_path: ./data/checkpoint-sampler.db

comfyui:
  url: http://comfyui-mock:8188
  workflow_dir: /data/workflows

# Allow the E2E frontend container to connect (Origin: http://frontend:3000 does
# not match Host: backend:8080 after Vite's changeOrigin proxy rewrite).
allowed_origins:
  - http://frontend:3000

# Thumbnail generation enabled for E2E tests so the sample-generation E2E
# suite can verify that thumbnails are created alongside generated images.
thumbnails:
  enabled: true
  max_resolution_x: 512
  max_resolution_y: 512
  jpeg_quality: 85
